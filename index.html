<style>
:root{
  --pink:#f3d3df; --pink2:#f9e6ed; --pinkd:#e7b6c8; --bg:#fffafb;
  --gold:#b98c32; --gold2:#d9b45f; --ink:#1d1a1b; --mute:#7c6c72; --line:#efdde4;
  --r:18px; --sh:0 6px 24px rgba(120,60,85,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:118px}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:90px}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.serif{font-family:Marcellus,serif;letter-spacing:.04em}
.script{font-family:Parisienne,cursive}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(255,250,251,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.brand b{font-family:Marcellus,serif;font-weight:400;font-size:21px;letter-spacing:.28em;
  background:linear-gradient(180deg,#e8c76f,#a77a22);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 0 #0000; filter:drop-shadow(0 1px 0 #1d1a1b)}
.brand i{font-family:Parisienne,cursive;font-style:normal;font-size:15px;color:var(--ink);margin-top:2px;padding-left:2px}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:#fff}
.lang button{padding:6px 11px;font-size:12px;font-weight:700;color:var(--mute)}
.lang button.on{background:var(--ink);color:#fff}
.tg{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--pink2);text-decoration:none}
.tg svg{width:19px;height:19px;fill:#2a8bd0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:30px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* hero */
.hero{background:var(--pink);position:relative;overflow:hidden}
.hero img{width:100%;max-width:900px;margin:0 auto;aspect-ratio:1280/711;object-fit:cover}
.hero-txt{text-align:center;padding:6px 16px 26px;margin-top:-8px}
.hero-txt p{color:#5b4a50;font-size:14.5px;max-width:520px;margin:0 auto 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:40px;font-weight:700;font-size:14.5px;text-decoration:none}
.btn-d{background:var(--ink);color:#fff}
.btn-g{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff}
.btn-l{background:#fff;color:var(--ink);border:1px solid var(--line)}
.hero-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px auto 0}
.fact{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;color:var(--mute)}
.fact b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
@media(min-width:760px){.facts{grid-template-columns:repeat(4,1fr)}}

/* sections */
section{padding:30px 0 6px}
.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh h2{font-family:Marcellus,serif;font-weight:400;font-size:25px;letter-spacing:.03em}
.sh .script{color:var(--gold);font-size:22px}
.sub{color:var(--mute);font-size:13.5px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1;background:var(--pink2);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.cb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:14.5px;font-weight:700;line-height:1.25}
.meta{font-size:12px;color:var(--mute)}
.vars{display:flex;flex-wrap:wrap;gap:5px}
.var{padding:4px 9px;border-radius:20px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--mute)}
.var.on{border-color:var(--ink);color:var(--ink);background:var(--pink2)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.price{font-weight:800;font-size:15px;white-space:nowrap}
.price small{font-weight:600;font-size:11px;color:var(--mute)}
.add{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:21px;line-height:1;display:grid;place-items:center;flex:none}
.qty{display:flex;align-items:center;background:var(--pink2);border-radius:30px}
.qty button{width:32px;height:34px;font-size:18px;font-weight:700}
.qty span{min-width:16px;text-align:center;font-weight:800;font-size:14px}

/* custom cake */
.custom{background:linear-gradient(160deg,#fff,var(--pink2));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.size{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left}
.size b{display:block;font-size:14px}
.size span{font-size:13px;color:var(--gold);font-weight:800}
.size.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.fills{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px}
.fill{padding:8px 12px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.fill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.l{display:block;font-weight:700;font-size:13.5px;margin-top:4px}
textarea,input,select{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--pinkd)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}

/* courses */
.courses{display:grid;gap:12px}
@media(min-width:700px){.courses{grid-template-columns:1fr 1fr}}
.course{background:var(--ink);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.course.on2{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.course h3{font-family:Marcellus,serif;font-weight:400;font-size:21px;margin-bottom:4px}
.course .pr{font-size:22px;font-weight:800;color:var(--gold2);margin:8px 0}
.course .pr s{font-size:14px;color:#a99;font-weight:600;margin-right:6px}
.course ul{list-style:none;font-size:13.5px;opacity:.9;margin-bottom:14px}
.course li{padding:3px 0 3px 18px;position:relative}
.course li:before{content:"✦";position:absolute;left:0;color:var(--gold2);font-size:11px;top:5px}

/* info / contacts */
.info{display:grid;gap:10px}
@media(min-width:700px){.info{grid-template-columns:1fr 1fr}}
.ibox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}
.ibox h4{font-size:14.5px;margin-bottom:5px}
.ibox p{font-size:13.5px;color:var(--mute)}
.contacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
footer{text-align:center;padding:30px 16px 20px;color:var(--mute);font-size:12px}
footer .brand{align-items:center;margin-bottom:8px}

/* cart button */
.cartbtn{position:fixed;left:50%;transform:translateX(-50%) translateY(120px);bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;
  width:min(92vw,460px);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-radius:40px;
  background:var(--ink);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s}
.cartbtn.show{transform:translateX(-50%) translateY(0)}
.cartbtn .cnt{background:var(--gold2);color:var(--ink);border-radius:20px;padding:2px 9px;font-size:13px;margin-right:8px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(29,26,27,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;
  transform:translateY(105%);transition:transform .28s;max-width:620px;margin:0 auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:Marcellus,serif;font-weight:400;font-size:22px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.x{font-family:Manrope,sans-serif;font-size:26px;line-height:1;color:var(--mute);padding:0 4px}
.ci{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ci img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--pink2)}
.ci .t{flex:1;min-width:0}
.ci .t b{display:block;font-size:13.5px}
.ci .t span{font-size:12px;color:var(--mute)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:12px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--pink2);padding:4px;border-radius:14px;margin:6px 0 4px}
.seg button{padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.fgrid{display:grid;gap:8px}
.err{border-color:#d9534f!important}
.ok{text-align:center;padding:8px 0}
.ok .big{font-size:44px}
.ok p{color:var(--mute);font-size:14px;margin:8px 0 14px}
.ok pre{white-space:pre-wrap;text-align:left;background:#fff;border:1px dashed var(--pinkd);border-radius:12px;padding:12px;font:13px/1.45 Manrope,sans-serif;max-height:200px;overflow:auto;margin-bottom:12px}
.stack{display:grid;gap:8px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb img{max-height:86vh;border-radius:14px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>

/* ---------- RENDER ---------- */
function cur(it){ if(!it.v) return {p:it.p,img:it.img}; var v=it.v[sel[it.id]||0]; return {p:v.p,img:v.img,v:v}; }
function keyOf(it){ return it.v ? it.id+":"+(sel[it.id]||0) : it.id; }
function qtyOf(k){ for(var i=0;i<cart.length;i++) if(cart[i].key===k) return cart[i].q; return 0; }

function renderMenu(){
  var h = "";
  CATS.forEach(function(c){
    h += '<section id="'+c.id+'"><div class="sh"><h2>'+c[lang]+'</h2><span class="script">'+c.s+'</span></div><p class="sub">'+SUBS[c.id][lang]+'</p><div class="grid">';
    MENU.filter(function(m){return m.c===c.id}).forEach(function(it){ h += card(it); });
    h += '</div></section>';
  });
  $("#menu").innerHTML = h;
}
function card(it){
  var c = cur(it), k = keyOf(it), q = qtyOf(k);
  var h = '<div class="card" id="c-'+it.id+'"><div class="ph" data-zoom="'+c.img+'"><img loading="lazy" src="'+img(c.img)+'" alt="'+esc(tx(it.n))+'">'+(it.tag?'<span class="tag">'+it.tag+'</span>':'')+'</div><div class="cb"><h3>'+esc(tx(it.n))+'</h3>';
  if(it.d) h += '<div class="meta">'+esc(tx(it.d))+'</div>';
  if(it.v){ h += '<div class="vars">'; it.v.forEach(function(v,i){ h += '<button class="var'+((sel[it.id]||0)===i?' on':'')+'" data-var="'+it.id+'" data-i="'+i+'">'+esc(v[lang])+'</button>'; }); h += '</div>'; }
  h += '<div class="row"><div class="price">'+money(c.p)+'</div>';
  h += q ? '<div class="qty"><button data-dec="'+it.id+'">−</button><span>'+q+'</span><button data-inc="'+it.id+'">+</button></div>' : '<button class="add" data-inc="'+it.id+'" aria-label="+">+</button>';
  h += '</div></div></div>';
  return h;
}
function rerenderCard(id){ var it = MENU.filter(function(m){return m.id===id})[0]; var el=$("#c-"+id); if(el){ el.outerHTML = card(it); } }

/* ---------- CART ---------- */
function total(){ return cart.reduce(function(s,x){return s+x.p*x.q},0); }
function count(){ return cart.reduce(function(s,x){return s+x.q},0); }
function updateCartBtn(){
  var n=count(); $("#cCnt").textContent=n; $("#cSum").textContent=money(total());
  $("#cartBtn").classList.toggle("show", n>0);
}
function addItem(id){
  var it = MENU.filter(function(m){return m.id===id})[0], c=cur(it), k=keyOf(it);
  var ex = cart.filter(function(x){return x.key===k})[0];
  if(ex) ex.q++; else cart.push({key:k, name: it.v ? {uz:tx2(it.n,"uz")+" — "+c.v.uz, ru:tx2(it.n,"ru")+" — "+c.v.ru} : {uz:tx2(it.n,"uz"),ru:tx2(it.n,"ru")}, img:c.img, p:c.p, q:1});
  save(); rerenderCard(id); updateCartBtn(); toast(L("added"));
}
function tx2(o,l){ return typeof o==="string"?o:o[l]; }
function decItem(k){
  for(var i=0;i<cart.length;i++) if(cart[i].key===k){ cart[i].q--; if(cart[i].q<=0) cart.splice(i,1); break; }
  save(); updateCartBtn();
}

function buildText(){

  cart.forEach(function(x){ t += "• "+x.name[lang]+(x.extra?" ("+x.extra[lang]+")":"")+" × "+x.q+" = "+money(x.p*x.q)+"\n"; });
  t += "\n"+L("oTot")+": "+money(total())+"\n\n";
  t += L("oName")+": "+form.name+"\n"+L("oPhone")+": "+form.phone+"\n";
  if(form.date){ var d=form.date.split("-"); t += L("oDate")+": "+d[2]+"."+d[1]+"."+d[0]+"\n"; }

  if(delivery && form.addr) t += L("oAddr")+": "+form.addr+"\n";
  if(form.com) t += L("oCom")+": "+form.com+"\n";
  return t;

function copy(text){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); }); }
  fallbackCopy(text); return Promise.resolve();
}
function fallbackCopy(text){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta);
}

document.addEventListener("click", function(e){

  if((a=t.getAttribute("data-var"))){ sel[a]=+t.getAttribute("data-i"); return rerenderCard(a); }
  if((a=t.getAttribute("data-inc"))) return addItem(a);
  if((a=t.getAttribute("data-dec"))){ var it=MENU.filter(function(m){return m.id===a})[0]; decItem(keyOf(it)); return rerenderCard(a); }
  if((a=t.getAttribute("data-size"))!==null && t.classList.contains("size")){ cSize=+a; return renderCustom(); }
  if((a=t.getAttribute("data-fill"))!==null && t.classList.contains("fill")){ cFill=+a; return renderCustom(); }
  if(t.id==="cAdd"){
    var s=SIZES[cSize], f=FILLS[cFill], w=$("#cWish").value.trim();
    var key="custom:"+cSize+":"+cFill+":"+w;
    var ex=cart.filter(function(x){return x.key===key})[0];
    if(ex) ex.q++; else cart.push({key:key, img:null, p:s.p, q:1,
      name:{uz:T.uz.oCus+" · "+s.uz, ru:T.ru.oCus+" · "+s.ru},
      extra:{uz:T.uz.oFill+": "+f.uz+(w?"; "+T.uz.oWish+": "+w:""), ru:T.ru.oFill+": "+f.ru+(w?"; "+T.ru.oWish+": "+w:"")}});
    save(); updateCartBtn(); toast(L("added")); return;
  }
  if((a=t.getAttribute("data-course"))){
    var msg = L("crsMsg")+L(a); copy(msg); toast(L("copied")); window.open("https://t.me/"+TG,"_blank"); return;
  }
  if(t.id==="cartBtn") return openSheet("cart");
  if(t.hasAttribute("data-close")) return closeSheet();
  if((a=t.getAttribute("data-step"))){ if(step==="form") readForm(); step=a; return renderSheet(); }
  if((a=t.getAttribute("data-cinc"))!==null){ cart[+a].q++; save(); updateCartBtn(); renderMenu(); return renderSheet(); }
  if((a=t.getAttribute("data-cdec"))!==null){ cart[+a].q--; if(cart[+a].q<=0) cart.splice(+a,1); save(); updateCartBtn(); renderMenu(); if(!cart.length){ closeSheet(); return; } return renderSheet(); }
  if((a=t.getAttribute("data-del"))!==null){ readForm(); delivery = a==="1"; return renderSheet(); }
  if(t.id==="sendBtn"){
    readForm();
    var ok=true;
    if(form.name.trim().length<2){ $("#fName").classList.add("err"); ok=false; }
    if(form.phone.replace(/\D/g,"").length<9){ $("#fPhone").classList.add("err"); ok=false; }
    if(!ok){ toast(L("fillErr")); return; }
    lastText = buildText();
    copy(lastText);
    step="ok"; renderSheet();
    setTimeout(function(){ window.open("https://t.me/"+TG,"_blank"); }, 450);
    return;
  }
  if(t.id==="copyAgain"){ copy(lastText); return toast(L("copied")); }
  if(t.id==="doneBtn"){ cart=[]; save(); updateCartBtn(); renderMenu(); closeSheet(); return; }
});

/* active chip on scroll */
var secIds = ["cakes","rolls","trifle","art","custom","courses","info"];
window.addEventListener("scroll", function(){
  var y = window.scrollY + 140, act = null;
  secIds.forEach(function(id){ var s=document.getElementById(id); if(s && s.offsetTop<=y) act=id; });
  document.querySelectorAll(".chip").forEach(function(c){
    var on = c.getAttribute("data-chip")===act;
    if(on && !c.classList.contains("on")){ c.classList.add("on"); c.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); }
    else if(!on) c.classList.remove("on");
  });
}, {passive:true});

renderAll();
</script>
